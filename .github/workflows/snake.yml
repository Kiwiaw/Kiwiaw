name: rabbit-hole snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#b86b77&color_dots=#f3ecdd,#e3cfa6,#cfa865,#a87a2e,#6e4a14
            dist/snake-dark.svg?palette=github-dark&color_snake=#bf923e&color_dots=#161b22,#1f3a37,#2f5f59,#4f8c85,#7fa9a4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
